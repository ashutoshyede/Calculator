<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrap">
        <div class="top"><button id="theme" aria-label="Switch theme" title="Switch theme">◐</button></div>
        <div class="calc">
            <div class="screen" aria-live="polite">
                <div class="expr" id="expr"></div>
                <div class="value" id="value">0</div>
            </div>
            <div class="keys" id="keys">
                <button data-a="clear">C</button>
                <button data-a="back" aria-label="Backspace">⌫</button>
                <button data-a="percent">%</button>
                <button class="op" data-a="op" data-v="/">÷</button>

                <button data-a="num" data-v="7">7</button>
                <button data-a="num" data-v="8">8</button>
                <button data-a="num" data-v="9">9</button>
                <button class="op" data-a="op" data-v="*">×</button>

                <button data-a="num" data-v="4">4</button>
                <button data-a="num" data-v="5">5</button>
                <button data-a="num" data-v="6">6</button>
                <button class="op" data-a="op" data-v="-">−</button>

                <button data-a="num" data-v="1">1</button>
                <button data-a="num" data-v="2">2</button>
                <button data-a="num" data-v="3">3</button>
                <button class="op" data-a="op" data-v="+">+</button>

                <button class="zero" data-a="num" data-v="0">0</button>
                <button data-a="dot">.</button>
                <button class="eq" data-a="eq">=</button>
            </div>
            <div class="hist">
                <div class="hist-head"><span>History</span><button id="clearHist">Clear history</button></div>
                <ul id="hist"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
